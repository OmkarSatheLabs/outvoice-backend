spring:
  application:
    name: outvoice
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/outvoice}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:local-db@123}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:outvoice}
  flyway:
    enabled: true
    default-schema: ${DB_SCHEMA:outvoice}
    schemas: ${DB_SCHEMA:outvoice}
    create-schemas: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
    notify: true

jwt:
  secret: ${JWT_SECRET:9f82c40b82f6e7c3b2a5d1e4c7b8a9f0e1d2c3b4a5f6e7d8c9b0a1f2e3d4c5b6}
  expiry-ms: ${JWT_EXPIRY_MS:86400000}

password-reset:
  expiry-ms: ${JWT_PASSWORD_RESET_EXPIRY_MS:3600000}

security:
  encryption:
    secret-key: ${ENCRYPTION_SECRET_KEY:0123456789abcdef0123456789abcdef} # 256-bit key for AES-GCM

app:
  # Comma-separated list of allowed CORS origins; override if frontend runs on a non-default port
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:https://dev.outvoice.omkarsathe.com,http://localhost:4200}
  upload-dir: ${UPLOAD_DIR:uploads}

outvoice:
  storage:
    provider: ${STORAGE_PROVIDER:local}
    local:
      base-directory: ${STORAGE_LOCAL_BASE_DIR:./uploads}
      public-base-url: ${STORAGE_LOCAL_PUBLIC_BASE_URL:http://localhost:8080/files}
    r2:
      account-id: ${CLOUDFLARE_R2_ACCOUNT_ID:}
      bucket: ${CLOUDFLARE_R2_BUCKET:}
      access-key-id: ${CLOUDFLARE_R2_ACCESS_KEY_ID:}
      secret-access-key: ${CLOUDFLARE_R2_SECRET_ACCESS_KEY:}
      endpoint: ${CLOUDFLARE_R2_ENDPOINT:}
      region: ${CLOUDFLARE_R2_REGION:auto}
      public-base-url: ${CLOUDFLARE_R2_PUBLIC_BASE_URL:}
      connection-timeout-seconds: ${CLOUDFLARE_R2_CONNECT_TIMEOUT:10}
      request-timeout-seconds: ${CLOUDFLARE_R2_REQUEST_TIMEOUT:30}
    images:
      max-file-size: ${STORAGE_MAX_FILE_SIZE:5242880}
      allowed-mime-types: image/jpeg,image/png,image/webp

rate-limit:
  auth:
    # Max requests per IP within the refill window for /api/auth/** endpoints
    capacity: ${RATE_LIMIT_AUTH_CAPACITY:20}
    refill-period-seconds: ${RATE_LIMIT_AUTH_REFILL_SECONDS:60}

sms:
  provider: textbee
  notify: true

  textbee:
    base-url: https://api.textbee.dev
    api-key: ${TEXTBEE_API_KEY:}
    device-id: ${TEXTBEE_DEVICE_ID:}

frontend:
  url: ${FRONTEND_URL:https://dev.outvoice.omkarsathe.com}

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    mail:
      enabled: false